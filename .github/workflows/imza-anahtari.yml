# Bir kez çalıştırılır: Android imza anahtarını üretir. Çıktıyı (Artifacts → imza-anahtari) indir, içindeki iki
# değeri Settings → Secrets and variables → Actions'a ekle, sonra bu çıktıyı sil (Actions sayfasında çöp kutusu).
# Anahtarı kaybetme: aynı anahtarla imzalanmayan APK, kurulu uygulamanın üstüne güncelleme olarak kurulamaz.
name: Android imza anahtarı üret

on:
  workflow_dispatch:

jobs:
  anahtar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Üret
        run: |
          SIFRE=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -keystore anahtar.jks -alias tentiforapp -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$SIFRE" -keypass "$SIFRE" -dname "CN=TentiforApp, O=TentiforApp, C=TR" > /dev/null 2>&1
          mkdir cikti
          base64 -w0 anahtar.jks > cikti/ANDROID_KEYSTORE_B64.txt
          printf '%s' "$SIFRE" > cikti/ANDROID_KEYSTORE_SIFRE.txt
          keytool -list -v -keystore anahtar.jks -storepass "$SIFRE" | grep -i "SHA256:" > cikti/parmak-izi.txt
          cp anahtar.jks cikti/anahtar-yedek.jks
          printf 'Bu klasörü güvenli bir yere yedekle (anahtar-yedek.jks ve şifre). Sonra GitHub Actions sayfasından bu çıktıyı sil.\n' > cikti/OKU.txt
      - uses: actions/upload-artifact@v4
        with:
          name: imza-anahtari
          path: cikti/
          retention-days: 1
