name: Android build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web and synchronize APK assets
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: uygulama/kabuk
        run: npm ci --no-audit --no-fund

      - name: Synchronize Capacitor Android project
        working-directory: uygulama/kabuk
        run: npx cap sync android

      - name: Run device-free Android validation
        working-directory: uygulama/kabuk/android
        run: ./gradlew --no-daemon --stacktrace :app:lint :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Android lint and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-android-validation-reports
          path: |
            uygulama/kabuk/android/app/build/reports/lint-results-debug.html
            uygulama/kabuk/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-debug-apk
          path: uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
