name: Android build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TF_ANDROID_SIGNING_READY: ${{ secrets.TF_ANDROID_KEYSTORE_BASE64 != '' && secrets.TF_ANDROID_KEYSTORE_PASSWORD != '' && secrets.TF_ANDROID_KEY_ALIAS != '' && secrets.TF_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          if [ -r /dev/kvm ]; then
            echo "KVM hazır: /dev/kvm"
          else
            echo "KVM bu runner'da kullanılamıyor; emulator yazılımsal hızlandırmaya düşecek."
          fi

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web and synchronize APK assets
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: uygulama/kabuk
        run: npm install --no-audit --no-fund

      - name: Synchronize Capacitor Android project
        working-directory: uygulama/kabuk
        run: npx cap sync android

      - name: Prepare release signing
        if: env.TF_ANDROID_SIGNING_READY == 'true'
        env:
          TF_ANDROID_KEYSTORE_BASE64: ${{ secrets.TF_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$TF_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tentifor-release.jks"

      - name: Build signed release APK
        if: env.TF_ANDROID_SIGNING_READY == 'true'
        working-directory: uygulama/kabuk/android
        env:
          TF_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tentifor-release.jks
          TF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TF_ANDROID_KEYSTORE_PASSWORD }}
          TF_ANDROID_KEY_ALIAS: ${{ secrets.TF_ANDROID_KEY_ALIAS }}
          TF_ANDROID_KEY_PASSWORD: ${{ secrets.TF_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build debug APK (signing secrets not configured)
        if: env.TF_ANDROID_SIGNING_READY != 'true'
        working-directory: uygulama/kabuk/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload signed release APK
        if: env.TF_ANDROID_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-release-apk
          path: uygulama/kabuk/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: env.TF_ANDROID_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-debug-apk
          path: uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android emulator smoke tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 900
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          working-directory: uygulama/kabuk/android
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-android-test-reports
          path: uygulama/kabuk/android/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14
