name: Android build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web and synchronize APK assets
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: uygulama/kabuk
        run: npm ci --no-audit --no-fund

      - name: Synchronize Capacitor Android project
        working-directory: uygulama/kabuk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: uygulama/kabuk/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-debug-apk
          path: uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android emulator smoke tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          cores: 2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: false
          working-directory: uygulama/kabuk/android
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-android-test-reports
          path: uygulama/kabuk/android/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14
