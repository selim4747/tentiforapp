name: Android build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TF_ANDROID_SIGNING_READY: ${{ secrets.TF_ANDROID_KEYSTORE_BASE64 != '' && secrets.TF_ANDROID_KEYSTORE_PASSWORD != '' && secrets.TF_ANDROID_KEY_ALIAS != '' && secrets.TF_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build web and synchronize APK assets
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: uygulama/kabuk
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Synchronize Capacitor Android project
        working-directory: uygulama/kabuk
        run: npx cap sync android

      - name: Prepare release signing
        if: env.TF_ANDROID_SIGNING_READY == 'true'
        env:
          TF_ANDROID_KEYSTORE_BASE64: ${{ secrets.TF_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$TF_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tentifor-release.jks"

      - name: Build signed release APK
        if: env.TF_ANDROID_SIGNING_READY == 'true'
        working-directory: uygulama/kabuk/android
        env:
          TF_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tentifor-release.jks
          TF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TF_ANDROID_KEYSTORE_PASSWORD }}
          TF_ANDROID_KEY_ALIAS: ${{ secrets.TF_ANDROID_KEY_ALIAS }}
          TF_ANDROID_KEY_PASSWORD: ${{ secrets.TF_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build debug APK (signing secrets not configured)
        if: env.TF_ANDROID_SIGNING_READY != 'true'
        working-directory: uygulama/kabuk/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output and retired-content absence
        if: always()
        run: |
          apk="${{ env.TF_ANDROID_SIGNING_READY == 'true' && 'uygulama/kabuk/android/app/build/outputs/apk/release/app-release.apk' || 'uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk' }}"
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import json, re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              config = json.loads(archive.read('assets/capacitor.config.json'))
              assert not config.get('server', {}).get('url'), 'APK cold start must use its bundled local web shell'
              assert 'tentifor.com' in config.get('server', {}).get('allowNavigation', []), 'live site navigation must remain allowed'
              required = ['assets/public/index.html', 'assets/public/sw.js', 'assets/public/veri.json', 'assets/public/js/core/125-live-site-bootstrap.js']
              for asset in required:
                  assert asset in names, f'missing offline APK asset: {asset}'
              service_worker = archive.read('assets/public/sw.js').decode('utf-8')
              block = re.search(r'const ILK\s*=\s*\[(.*?)\];', service_worker, re.S)
              assert block, 'offline precache manifest must exist'
              entries = re.findall(r"[\"']([^\"']+)[\"']", block.group(1))
              for entry in entries:
                  relative = entry.split('?', 1)[0].lstrip('./') or 'index.html'
                  assert f'assets/public/{relative}' in names, f'precache asset missing from APK: {entry}'
              assert not any('34b-model-evreni.js' in entry for entry in entries), 'retired model asset must not be precached'
              print(f'Offline APK shell verified: {len(entries)} precache assets')
          PY
          retired_pattern='cl''aude|et''erya|fornek-et''erya'
          if unzip -l "$apk" | grep -Eiq "$retired_pattern"; then
            echo 'Emekli evren içeriği APK içinde bulundu'
            exit 1
          fi
          echo "APK doğrulandı: $apk"
      - name: Upload signed release APK
        if: env.TF_ANDROID_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-release-apk
          path: uygulama/kabuk/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: env.TF_ANDROID_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-debug-apk
          path: uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
