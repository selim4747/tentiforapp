# Android uygulaması (APK): main'de uygulama/kabuk/**, bu dosya ya da ikon/ikon-512.png değişince kendiliğinden
# derlenir; elle de çalıştırılabilir (Actions → "Android APK" → Run workflow, isteğe bağlı "not" ile).
# Uygulama siteyi internetten açar (uygulama/kabuk/capacitor.config.json); içerik her Yayınla'da kendiliğinden güncellenir.
# APK yalnızca kabuk değişince (simge, ad, yerel özellikler) yeniden derlenir. Derlenen APK depoya
# uygulama/indir/ altına konur; Yayınla ile sitede /uygulama/indir/tentiforapp.apk olur ve uygulama yeni sürümü haber verir.
#
# Gerekli gizli ayarlar (Settings → Secrets and variables → Actions), bir kez:
#   ANDROID_KEYSTORE_B64   imza anahtarı (base64)  — "Android imza anahtarı üret" iş akışının çıktısından
#   ANDROID_KEYSTORE_SIFRE anahtar şifresi         — aynı çıktıdan
# İsteğe bağlı: CLOUDFLARE_DEPLOY_HOOK — varsa APK konunca site kendiliğinden yeniden yayınlanır.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "uygulama/kabuk/**"
      - ".github/workflows/apk.yml"
      - "ikon/ikon-512.png"
  workflow_dispatch:
    inputs:
      not:
        description: "Bu sürümde ne değişti (uygulamada gösterilir)"
        required: false
        default: ""

permissions:
  contents: write

# arka arkaya iki push gelirse derlemeler sırayla çalışır (sürüm kodu ve depoya yazma çakışmasın)
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: İmza anahtarı var mı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SIFRE: ${{ secrets.ANDROID_KEYSTORE_SIFRE }}
        run: |
          if [ -z "$KS" ] || [ -z "$SIFRE" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 ve ANDROID_KEYSTORE_SIFRE gizli ayarları yok. Önce 'Android imza anahtarı üret' iş akışını çalıştır (uygulama/README.md)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor
        working-directory: uygulama/kabuk
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: E-posta bağlantıları uygulamayı açsın
        working-directory: uygulama/kabuk/android
        run: |
          python3 - <<'PY'
          p = "app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = """
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="tentiforapp.pages.dev" android:pathPrefix="/uygulama/ac" />
                      </intent-filter>
          """
          assert "</activity>" in s
          open(p, "w").write(s.replace("</activity>", f + "        </activity>", 1))
          PY
          grep -n "uygulama/ac" app/src/main/AndroidManifest.xml

      - name: Uygulama simgesi kısayolları (basılı tut)
        working-directory: uygulama/kabuk/android
        run: |
          python3 - <<'PY'
          import os
          k = [("devam", "Kaldığın yer", "Kaldığın yerden oku"), ("bugun", "Bugün", "Bugün: günün oyunları"),
               ("havi", "Harita Avı", "Harita Avı"), ("bulmaca", "Bulmaca", "Haftanın bulmacası")]
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          x = ['<?xml version="1.0" encoding="utf-8"?>', '<shortcuts xmlns:android="http://schemas.android.com/apk/res/android">']
          for i, (id_, kisa, uzun) in enumerate(k):
              x.append(f'  <shortcut android:shortcutId="{id_}" android:enabled="true" android:icon="@mipmap/ic_launcher" '
                       f'android:shortcutShortLabel="@string/kisayol_{id_}_kisa" android:shortcutLongLabel="@string/kisayol_{id_}">')
              x.append(f'    <intent android:action="android.intent.action.VIEW" android:targetPackage="dev.pages.tentiforapp" '
                       f'android:targetClass="dev.pages.tentiforapp.MainActivity" android:data="https://tentiforapp.pages.dev/uygulama/ac/?kisayol={id_}" />')
              x.append('  </shortcut>')
          x.append('</shortcuts>')
          open("app/src/main/res/xml/shortcuts.xml", "w").write("\n".join(x) + "\n")
          p = "app/src/main/res/values/strings.xml"
          s = open(p).read()
          ek = "".join(f'    <string name="kisayol_{i}_kisa">{a}</string>\n    <string name="kisayol_{i}">{b}</string>\n' for i, a, b in k)
          assert "</resources>" in s
          open(p, "w").write(s.replace("</resources>", ek + "</resources>", 1))
          p = "app/src/main/AndroidManifest.xml"
          s = open(p).read()
          assert "</activity>" in s
          open(p, "w").write(s.replace("</activity>", '    <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />\n        </activity>', 1))
          PY
          grep -n "android.app.shortcuts" app/src/main/AndroidManifest.xml

      - name: Sürüm ve simge
        working-directory: uygulama/kabuk/android
        run: |
          KOD=$((100 + ${{ github.run_number }}))
          AD=$(node -e "console.log(require('../../../veri.json').surum || '1.0.0')")
          sed -i "s/versionCode [0-9]*/versionCode $KOD/; s/versionName \"[^\"]*\"/versionName \"$AD\"/" app/build.gradle
          echo "KOD=$KOD" >> $GITHUB_ENV
          echo "AD=$AD" >> $GITHUB_ENV
          # simge: sitenin ikonu (uyarlanabilir simge dosyaları kaldırılır, düz PNG kullanılır)
          rm -rf app/src/main/res/mipmap-anydpi-v26
          if command -v magick >/dev/null; then IM=magick
          elif command -v convert >/dev/null; then IM=convert
          else sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null && IM=convert; fi
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            klasor=app/src/main/res/mipmap-${d%%:*}; boy=${d##*:}
            mkdir -p $klasor
            $IM ../../../ikon/ikon-512.png -resize ${boy}x${boy} $klasor/ic_launcher.png
            cp $klasor/ic_launcher.png $klasor/ic_launcher_round.png
            rm -f $klasor/ic_launcher_foreground.png
          done
          # açılış ekranı (3.0): Capacitor'ın kendi logosu yerine buz rengi zemin üzerinde sitenin ikonu
          if [ "$IM" = magick ]; then KIM="magick identify"; else KIM=identify; fi
          find app/src/main/res -name 'splash.png' | while read f; do
            boyut=$($KIM -format '%w %h' "$f"); g=${boyut% *}; y=${boyut#* }
            k=$(( (g < y ? g : y) * 30 / 100 ))
            $IM -size ${g}x${y} xc:'#F4F9FD' \( ../../../ikon/ikon-512.png -resize ${k}x${k} \) -gravity center -composite "$f"
          done
          find app/src/main/res -name 'splash.png' | head -3

      - name: Derle ve imzala
        working-directory: uygulama/kabuk/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SIFRE: ${{ secrets.ANDROID_KEYSTORE_SIFRE }}
        run: |
          ./gradlew assembleRelease --no-daemon
          echo "$KS" | base64 -d > $RUNNER_TEMP/anahtar.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/hizali.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/anahtar.jks --ks-key-alias tentiforapp --ks-pass env:SIFRE --key-pass env:SIFRE \
            --out $RUNNER_TEMP/tentiforapp.apk $RUNNER_TEMP/hizali.apk
          $BT/apksigner verify $RUNNER_TEMP/tentiforapp.apk
          rm -f $RUNNER_TEMP/anahtar.jks

      - name: Siteye koy
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SIFRE: ${{ secrets.ANDROID_KEYSTORE_SIFRE }}
          NOT: ${{ github.event.inputs.not }}
        run: |
          mkdir -p uygulama/indir
          cp $RUNNER_TEMP/tentiforapp.apk uygulama/indir/tentiforapp.apk
          BOYUT=$(stat -c %s uygulama/indir/tentiforapp.apk)
          node -e "require('fs').writeFileSync('uygulama/indir/apk.json', JSON.stringify({ kod: Number(process.env.KOD), surum: process.env.AD, boyut: $BOYUT, tarih: new Date().toISOString(), not: String(process.env.NOT || '').slice(0, 300) }, null, 2) + '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          # site ile uygulama birbirini tanısın (e-posta bağlantıları doğrudan uygulamada açılır); parmak izi gizli değildir
          echo "$KS" | base64 -d > $RUNNER_TEMP/anahtar.jks
          PARMAK=$(keytool -list -v -keystore $RUNNER_TEMP/anahtar.jks -storepass:env SIFRE -alias tentiforapp | grep -m1 "SHA256:" | awk '{print $2}')
          rm -f $RUNNER_TEMP/anahtar.jks
          [ -n "$PARMAK" ] || { echo "::error::İmza parmak izi okunamadı"; exit 1; }
          mkdir -p .well-known
          node -e "require('fs').writeFileSync('.well-known/assetlinks.json', JSON.stringify([{ relation: ['delegate_permission/common.handle_all_urls'], target: { namespace: 'android_app', package_name: 'dev.pages.tentiforapp', sha256_cert_fingerprints: [process.argv[1]] } }], null, 2) + '\\n')" "$PARMAK"
          git add uygulama/indir .well-known/assetlinks.json
          git commit -m "Android APK $AD ($KOD) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}   # derleme sürerken main ilerlediyse
          git push

      - name: Siteyi yayınla (isteğe bağlı)
        env:
          KANCA: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$KANCA" ]; then curl -fsS -X POST "$KANCA" > /dev/null && echo "Yayın tetiklendi"; else echo "CLOUDFLARE_DEPLOY_HOOK yok: panelden Yayınla'ya bas."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: tentiforapp-apk
          path: ${{ runner.temp }}/tentiforapp.apk
          retention-days: 14
