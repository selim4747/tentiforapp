name: Android APK oluştur

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Tentiforverse APK
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uygulama/kabuk/package-lock.json

      - name: Web paketini oluştur
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Capacitor kabuğunu kur
        working-directory: uygulama/kabuk
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Debug APK derle
        working-directory: uygulama/kabuk/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK metadata oluştur
        run: |
          apk="uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk"
          version=$(node -p "require('./veri.json').surum")
          version_code=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' uygulama/kabuk/android/app/build.gradle | head -1)
          certificate=$(apksigner verify --print-certs "$apk" 2>/dev/null | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          python3 - "$apk" "$version" "$version_code" "${certificate:-unknown}" <<'PY'
          import hashlib, json, pathlib, sys
          apk, version, version_code, certificate = sys.argv[1:]
          path = pathlib.Path(apk)
          data = {
              'packageName': 'dev.pages.tentiforapp',
              'version': version,
              'versionCode': int(version_code),
              'sizeBytes': path.stat().st_size,
              'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'signingType': 'debug',
              'certificateSha256': certificate,
          }
          pathlib.Path('uygulama/indir/apk.json').write_text(json.dumps(data, indent=2) + '\n')
          print(json.dumps(data, indent=2))
          PY

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: tentiforverse-debug-apk
          path: |
            uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk
            uygulama/indir/apk.json
          if-no-files-found: error
          retention-days: 14
