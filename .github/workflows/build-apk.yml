name: Android APK oluştur

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Tentiforverse APK
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uygulama/kabuk/package.json

      - name: Web paketini oluştur
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Capacitor kabuğunu kur ve Android varlıklarını eşitle
        working-directory: uygulama/kabuk
        run: |
          npm ci --no-audit --no-fund
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Debug APK derle
        working-directory: uygulama/kabuk/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: tentiforverse-debug-apk
          path: uygulama/kabuk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
