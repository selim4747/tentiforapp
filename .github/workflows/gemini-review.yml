name: Gemini Kod Müfettişi

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR Farklarını (Diff) Al
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Gemini İncelemesi Yap ve PR'a Yorum At
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          api_key = os.environ.get("GEMINI_API_KEY")
          pr_number = os.environ.get("PR_NUMBER")

          if not os.path.exists("diff.txt"):
              print("diff.txt bulunamadı.")
              exit(0)

          with open("diff.txt", "r", encoding="utf-8", errors="ignore") as f:
              diff_content = f.read()[:20000]

          if not diff_content.strip():
              print("İncelenecek bir kod değişikliği yok.")
              exit(0)

          prompt = f"""Sen esprili, dobra ama son derece tecrübeli bir Kıdemli Yazılım Mimarı ve Kod Müfettişisin.
          Aşağıdaki Pull Request kod farklarını (git diff) tara ve Türkçe bir inceleme raporu hazırla.

          Şu başlıklara göre cevap ver:
          1. 🚨 **Gözüme Çarpan Riskler & Spagetti Kokuları:** (Bug'lar, mantık hataları, performans sorunları)
          2. 💡 **Daha Temiz Kod Tavsiyeleri:** (Okunabilirlik ve mimari iyileştirmeler)
          3. 🔨 **Hemen Ne Yapacaksın? (TODO Listesi):** (Geliştiricinin merge etmeden önce mutlaka düzeltmesi gereken somut adımlar)

          İşte Kod Değişiklikleri:
          {diff_content}
          """

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
          payload = {
              "contents": [{"parts": [{"text": prompt}]}]
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as res:
                  data = json.loads(res.read().decode())
                  review = data["candidates"][0]["content"]["parts"][0]["text"]

                  with open("review.md", "w", encoding="utf-8") as out:
                      out.write("### 🤖 Gemini Kod İnceleme Raporu\n\n" + review)
          except Exception as e:
              print(f"API Hatası: {e}")
              exit(1)
          EOF

          if [ -f review.md ]; then
            gh pr comment "$PR_NUMBER" --body-file review.md
          fi
          
