name: Gemini Kod Müfettişi ve Yol Haritası

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Değişiklikleri Al
        run: |
          git diff HEAD~1 HEAD > diff.txt

      - name: Gemini Analiz ve Görev Emri
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          api_key = os.environ.get("GEMINI_API_KEY")

          if not os.path.exists("diff.txt"):
              print("diff.txt bulunamadı.")
              exit(0)

          with open("diff.txt", "r", encoding="utf-8", errors="ignore") as f:
              diff_content = f.read()[:25000]

          if not diff_content.strip():
              review = "### 🧐 Durum Tespiti\nHerhangi bir kod farkı yakalayamadım, boş commit mi attın patron?"
          else:
              prompt = f"""Sen dobra, hafif esprili ama tavizsiz bir Kıdemli Yazılım Mühendisisin.
              Aşağıdaki commit farklarını (git diff) incele. Geliştiriciye duruma özel NET EMİRLER ve YOL HARİTASI çıkar.

              Raporunu tam olarak şu başlıklar altında ver:

              ### 1. 🚨 Durum Analizi: Ne Durumdayız?
              (Kodda patlama riski, mantık hatası, spagetti kokusu veya bellek tuzağı var mı? Durumu teşhis et.)

              ### 2. 🎯 Senaryoya Göre "Ne Yapmalısın?":
              - **Eğer Hata/Bug Varsa:** (Derhal şunu düzelt, şu satırdaki mantığı ters çevir vb.)
              - **Eğer Kod Çalışıyor ama Mimari Dağınıksa:** (Şu fonksiyonu ikiye böl, değişkenleri şuraya taşı vb.)
              - **Eğer Kod Çiçek Gibiyse:** (Eline sağlık, şimdi sıradaki şu aşamaya/mekaniğe geçebilirsin de.)

              ### 3. 📋 Sıradaki Adım (TODO Listesi):
              - [ ] 1. Adım...
              - [ ] 2. Adım...
              - [ ] 3. Adım...

              İşte Değişiklikler:
              {diff_content}
              """

              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}

              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )

              try:
                  with urllib.request.urlopen(req) as res:
                      data = json.loads(res.read().decode())
                      review = data["candidates"][0]["content"]["parts"][0]["text"]
              except Exception as e:
                  review = f"Müfettiş uyuyakaldı, API Hatası: {e}"

          # Raporu GitHub Actions Özet Sayfasına (Job Summary) yazdır
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as sf:
                  sf.write("## 🤖 Gemini Müfettiş Raporu\n\n" + review)
          EOF
