# Yayın paketi: scripts/paketle.mjs dosyaları küçültüp dist/ klasörüne koyar.
[build]
  command = "npm ci --omit=dev --no-audit --no-fund && npm run paketle"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Profil kısa adresi: /u/kullaniciadi → site açılır, profil gösterilir
[[redirects]]
  from = "/u/*"
  to = "/?profil=:splat"
  status = 302

# Paylaşım hedefi: servis çalışanı yoksa (ilk açılış) sayfaya dön
[[redirects]]
  from = "/paylasim-al"
  to = "/#/fanAc"
  status = 303
